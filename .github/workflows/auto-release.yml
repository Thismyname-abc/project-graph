name: Auto Release
run-name: "Auto Release ${{ inputs.checkout_ref }}"

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "构建基于的 commit SHA（release 也 target 到该 commit）"
        required: false
        default: "8761bef8af805b0656e53370d20c27e5bdc6a3a8"
      prerelease:
        type: boolean
        description: "Is pre-release"
        required: false
        default: true
      delete_release:
        type: boolean
        description: "删除以前的 release"
        required: false
        default: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next patch version
        id: compute
        run: |
          last=$(git tag --sort=-v:refname 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$last" ]; then
            echo "::error::未找到形如 vx.y.z 的版本 tag"
            exit 1
          fi
          echo "last=$last"
          v=${last#v}
          IFS='.' read -r maj min pat <<< "$v"
          echo "version=$maj.$min.$((pat + 1))" >> "$GITHUB_OUTPUT"

  release:
    needs: compute-version
    uses: ./.github/workflows/publish.yml
    with:
      android_key_alias: "upload"
      android_key_path: "upload.jks"
      app_version: ${{ needs.compute-version.outputs.version }}
      app_version_android: ${{ needs.compute-version.outputs.version }}
      # 跳过 AUR 同步：本仓库未配置 AUR_SSH_PRIVATE_KEY
      aur_package_name: ""
      aur_version: ${{ needs.compute-version.outputs.version }}
      checkout_ref: ${{ inputs.checkout_ref }}
      delete_release: ${{ inputs.delete_release }}
      prerelease: ${{ inputs.prerelease }}
      release_name: "v${{ needs.compute-version.outputs.version }}"
      release_tag: "v${{ needs.compute-version.outputs.version }}"
      task_build: build:ci
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
